# Shiro System Theme v2.0
# Based on design reference: shiro-system-design-reference.md
#
# KEY CHANGES:
# - All titles/badges: Y=50 with lm anchor (vertically centered in header)
# - Zones 1-3: Labels la at row_start+15, bars at row_end-35, hero baseline at bar_top-15
# - Zone 4: Values rm at row center, labels lb at baseline
# - Font: Barlow (was Roboto)
# - Grid: Zones 1-3 use 95px rows, Zone 4 uses 75px rows with dual headers

