          - WHEN: "Gpu0_Temp >= 85"
            TEXT: "TEMP"
            BACKGROUND_COLOR: 239, 68, 68
          - WHEN: "Gpu0_Temp >= 70"
            TEXT: "TEMP"
            BACKGROUND_COLOR: 245, 158, 11
          - ELSE: true
