    # Bandwidth Values
    Bw_GpuRx:
      TEXT:
        SHOW: True
        X: 1680
        Y: 45
        FONT: roboto-mono/RobotoMono-Bold.ttf
        FONT_SIZE: 24
        FONT_COLOR: 0, 0, 0
    Bw_GpuTx:
      TEXT:
        SHOW: True
        X: 1680
        Y: 85
        FONT: roboto-mono/RobotoMono-Bold.ttf
        FONT_SIZE: 24
        FONT_COLOR: 0, 0, 0
    Bw_SsdRead:
      TEXT:
        SHOW: True
        X: 1680
        Y: 125
        FONT: roboto-mono/RobotoMono-Bold.ttf
        FONT_SIZE: 24
        FONT_COLOR: 0, 0, 0
    Bw_SsdWrite:
      TEXT:
        SHOW: True
        X: 1680
        Y: 165
        FONT: roboto-mono/RobotoMono-Bold.ttf
        FONT_SIZE: 24
        FONT_COLOR: 0, 0, 0
    Bw_NetRx:
      TEXT:
        SHOW: True
        X: 1680
        Y: 205
        FONT: roboto-mono/RobotoMono-Bold.ttf
        FONT_SIZE: 24
        FONT_COLOR: 0, 0, 0
    Bw_NetTx:
      TEXT:
        SHOW: True
        X: 1680
        Y: 245
        FONT: roboto-mono/RobotoMono-Bold.ttf
        FONT_SIZE: 24
        FONT_COLOR: 0, 0, 0
    Bw_RamUsed:
      TEXT:
        SHOW: True
        X: 1680
        Y: 295
        FONT: roboto-mono/RobotoMono-Bold.ttf
        FONT_SIZE: 24
        FONT_COLOR: 0, 0, 0
    Bw_SsdUsed:
      TEXT:
        SHOW: True
        X: 1680
        Y: 335
        FONT: roboto-mono/RobotoMono-Bold.ttf
        FONT_SIZE: 24
        FONT_COLOR: 0, 0, 0

    # Conditional Status Indicators (Phase 5)
    # GPU0 State - shows ACTIVE/IDLE based on P-state
    Gpu0_StateFlag:
      TEXT:
        SHOW: True
        X: 20
        Y: 440
        FONT: roboto-mono/RobotoMono-Bold.ttf
        FONT_SIZE: 16
        FONT_COLOR: 255, 255, 255
        PADDING: 4, 12
        BACKGROUND_COLOR: 136, 136, 136
        CASE:
          - WHEN: "Gpu0_Pstate != 'P8'"
            TEXT: "ACTIVE"
            BACKGROUND_COLOR: 0, 0, 0
          - ELSE: true
            TEXT: "IDLE"

    # GPU0 Temperature indicator - color coded
    Gpu0_TempFlag:
      TEXT:
        SHOW: True
        X: 100
        Y: 440
        FONT: roboto-mono/RobotoMono-Bold.ttf
        FONT_SIZE: 16
        FONT_COLOR: 255, 255, 255
        PADDING: 4, 12
        CASE:
          - WHEN: "Gpu0_Temp >= 85"
            TEXT: "TEMP"
            BACKGROUND_COLOR: 208, 2, 27
          - WHEN: "Gpu0_Temp >= 70"
            TEXT: "TEMP"
            BACKGROUND_COLOR: 245, 166, 35
          - ELSE: true
            TEXT: "TEMP"
            BACKGROUND_COLOR: 46, 204, 113

    # GPU0 Power indicator - shows when power capped
    Gpu0_PowerFlag:
      TEXT:
        SHOW: True
        X: 175
        Y: 440
        FONT: roboto-mono/RobotoMono-Bold.ttf
        FONT_SIZE: 16
        FONT_COLOR: 255, 255, 255
        PADDING: 4, 12
        CASE:
          - WHEN: "Gpu0_SwPowerCap == 'Active'"
            TEXT: "POWER"
            BACKGROUND_COLOR: 208, 2, 27
          - WHEN: "Gpu0_Power >= 500"
            TEXT: "POWER"
            BACKGROUND_COLOR: 245, 166, 35
          - ELSE: true
            TEXT: "POWER"
            BACKGROUND_COLOR: 46, 204, 113

    # GPU0 Cooling indicator - warns when GPU working but fan off
    Gpu0_CoolFlag:
      TEXT:
        SHOW: True
        X: 260
        Y: 440
        FONT: roboto-mono/RobotoMono-Bold.ttf
        FONT_SIZE: 16
        FONT_COLOR: 255, 255, 255
        PADDING: 4, 12
        CASE:
          - WHEN: "Gpu0_Fan == 0 and Gpu0_Pstate != 'P8'"
            TEXT: "COOL"
            BACKGROUND_COLOR: 208, 2, 27
          - WHEN: "Gpu0_Fan >= 90"
            TEXT: "COOL"
            BACKGROUND_COLOR: 245, 166, 35
          - ELSE: true
            TEXT: "COOL"
            BACKGROUND_COLOR: 46, 204, 113
