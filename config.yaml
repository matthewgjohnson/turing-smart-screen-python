---
config:
  COM_PORT: "AUTO"
  THEME: AMD
  HW_SENSORS: AUTO
  ETH: ""
  WLO: ""
  CPU_FAN: AUTO
  PING: ""
  WEATHER_API_KEY: ""
  WEATHER_LATITUDE: 45.75
