    REINIT_MINUTES: 3
    REVISION: C_USB
    DISPLAY_REVERSE: true
    BRIGHTNESS: 30
  - DEVICE: 1
    THEME: shiro-system
    REVISION: C_USB
    DISPLAY_REVERSE: false
    BRIGHTNESS: 30
  - DEVICE: 2
    IMAGE: res/images/shiro-image-horiz-06.png
    REVISION: C_USB
    DISPLAY_REVERSE: false
    BRIGHTNESS: 30
