[project]
name = "turing-smart-screen-python"
version = "0.1.0"
requires-python = ">= 3.9"
dependencies = [
    "pyserial~=3.5",
    "PyYAML~=6.0.3",
    "psutil~=7.1.1",
    "pystray~=0.19.5",
    "babel~=2.17.0",
    "ruamel.yaml~=0.18.16",
    "sv-ttk~=2.6.1",
    "tkinter-tooltip~=3.1.2",
    "uptime~=3.0.1",
    "requests~=2.32.5",
    "ping3~=5.1.5",
    "pyinstaller~=6.16.0",
    "pyusb~=1.3.1",
    "pycryptodome~=3.23.0",
    "Pillow>=11.0.0",
    "numpy>=2.0.0",
    "GPUtil @ git+https://github.com/mathoudebine/gputil.git@1.4.1-py3.13",
]

[tool.pytest.ini_options]
markers = [
    "integration: tests that run on real hardware (Shiro)",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]
